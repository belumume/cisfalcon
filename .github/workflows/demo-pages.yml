name: Browser demo

# Publishes webdemo/ to GitHub Pages: a static page that runs the gate in the visitor's own
# browser, so the live tool costs nothing to host and nothing to keep running.
#
# The 120 MB of converted weights are deliberately NOT in git. This job fetches the three
# hash-verified activity models from Zenodo, converts them for the web, and proves the result
# against the Python gate (webdemo/parity.test.mjs) before anything is published. A conversion
# that moved a verdict fails the deploy instead of reaching the page.
#
# Runner time: this repository is public, so Actions minutes are free here. It still runs
# rarely by design, on a path filter plus manual dispatch, and the weight conversion is cached.

on:
  push:
    branches: [main]
    paths:
      - "webdemo/**"
      - "gate.py"
      - "verifier.py"
      - "fetch_models.py"
      - ".github/workflows/demo-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The weights are frozen and the conversion is deterministic, so a hit here skips both
      # the 251 MB download and the conversion.
      - id: weights
        uses: actions/cache@v4
        with:
          path: webdemo/models
          key: webdemo-weights-${{ hashFiles('fetch_models.py', 'webdemo/build.py') }}

      # Always: copy the served frontend, point it at the in-browser engine, export the
      # isotonic calibration. Needs only the reviewer requirements, no TensorFlow.
      - name: Assemble the page
        run: |
          python -m pip install --quiet -r requirements.txt
          python webdemo/build.py --no-models

      - name: Fetch and convert the fold models
        if: steps.weights.outputs.cache-hit != 'true'
        run: |
          python -m pip install --quiet "tensorflowjs==4.22.0" "setuptools<81"
          python webdemo/build.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The gate's numbers against the Python reference, then the agent layer against
      # intercepted API calls (no key, no spend).
      - name: Check the page against the Python pipeline
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
          node webdemo/parity.test.mjs
          node webdemo/agents.test.mjs

      # enablement lets the first run turn Pages on by itself, so publishing needs no
      # click in the repository settings.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: webdemo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
