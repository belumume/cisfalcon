# Retired on 2026-11-12. The live tool is now a static page that runs the gate in the
# visitor's own browser (webdemo/, published to https://belumume.github.io/cisfalcon/), so
# there is no server to pay for. This file is kept only as the record of how the hosted
# version was configured; do not deploy it.
app = "cisfalcon-lifesci"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-8x"
  memory = "8gb"
